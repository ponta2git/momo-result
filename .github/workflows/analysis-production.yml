name: Analysis production operation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Determine and apply required analysis maintenance, or select one operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - promote
          - backfill
          - check

permissions:
  contents: read

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://momo-result.ponta.me
    steps:
      - name: Reject operations during the DB-job cutover
        env:
          JOBS_CUTOVER_COMPLETE: ${{ vars.JOBS_CUTOVER_COMPLETE }}
        run: test "${JOBS_CUTOVER_COMPLETE}" = true

      - name: Require master
        run: test "${GITHUB_REF}" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build structured CI tool
        uses: ./.github/actions/setup-ci-tool

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79
      - name: Reconcile deployed analysis generation
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: scripts/ops/analysis-maintain.sh "${OPERATION}"
      - name: Summarize maintenance and required follow-up
        if: always()
        env:
          OPERATION_RESULT: ${{ job.status }}
        run: scripts/ci/analysis-maintenance-summary.sh
      - name: Upload operation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: analysis-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis-production-artifact/
          if-no-files-found: ignore
          retention-days: 7
