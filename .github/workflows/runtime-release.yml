name: Release

on:
  workflow_dispatch:
    inputs:
      receipt_json:
        description: Reviewed publication receipt for the resumed cutover and exact deployed provenance
        required: true
        type: string
  workflow_run:
    workflows:
      - deploy
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

jobs:
  normal-permission:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.control.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-maintenance-control
      - name: Check whether ordinary publication is held
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/maintenance-control.sh normal-status >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish release notes
    needs: normal-permission
    if: needs.normal-permission.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      # workflow_run uses the workflow and scripts from the protected default
      # branch. It does not execute artifacts or code from the triggering run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-maintenance-control
      - uses: ./.github/actions/setup-ci-tool

      - name: Download the actual normal deployment completion
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: normal-deployment-completion-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: normal-deployment-completion
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Reject a candidate-only or stale completion
        env:
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          scripts/ci/ci-tool.sh normal-deployment-completion "${DEPLOY_RUN_ID}" "${DEPLOY_RUN_ATTEMPT}" "${RELEASE_SHA}" \
            < normal-deployment-completion/normal-deployment-completion.json

      - name: Publish the completed normal deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-runtime-release.sh normal

  prepare-maintenance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      deployment_run_id: ${{ steps.scope.outputs.deployment_run_id }}
      deployment_run_attempt: ${{ steps.scope.outputs.deployment_run_attempt }}
      provenance_artifact_id: ${{ steps.scope.outputs.provenance_artifact_id }}
      release_sha: ${{ steps.scope.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tool
      - uses: ./.github/actions/setup-maintenance-control
      - name: Bind publication to this run and the deployed provenance
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_INPUT: ${{ inputs.receipt_json }}
        run: |
          umask 077
          printf '%s\n' "${RECEIPT_INPUT}" > receipt-input.json
          scripts/ci/maintenance-control.sh bind-receipt publish receipt-input.json receipt.json
          scripts/ci/ci-tool.sh maintenance-operation-scope receipt.json publish >> "${GITHUB_OUTPUT}"
      - name: Upload the immutable receipt for approval
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30

  publish-maintenance:
    name: Publish the resumed release
    needs: prepare-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://momo-result.ponta.me
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      DEPLOY_RUN_ID: ${{ needs.prepare-maintenance.outputs.deployment_run_id }}
      DEPLOY_RUN_ATTEMPT: ${{ needs.prepare-maintenance.outputs.deployment_run_attempt }}
      PROVENANCE_ARTIFACT_ID: ${{ needs.prepare-maintenance.outputs.provenance_artifact_id }}
      RELEASE_SHA: ${{ needs.prepare-maintenance.outputs.release_sha }}
      MAINTENANCE_RECEIPT: maintenance-receipt/receipt.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tool
      - uses: ./.github/actions/setup-maintenance-control
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-maintenance.outputs.receipt_artifact_id }}
          path: maintenance-receipt
      - name: Recheck permission and the actual deployment attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/maintenance-control.sh maintenance-guard publish "${MAINTENANCE_RECEIPT}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}/attempts/${DEPLOY_RUN_ATTEMPT}" |
            scripts/ci/ci-tool.sh maintenance-publish-evidence "${MAINTENANCE_RECEIPT}" run
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROVENANCE_ARTIFACT_ID}" |
            scripts/ci/ci-tool.sh maintenance-publish-evidence "${MAINTENANCE_RECEIPT}" artifact
      - name: Download the exact deployed provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-maintenance.outputs.provenance_artifact_id }}
          path: deployed-provenance
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare-maintenance.outputs.deployment_run_id }}
      - name: Download the completed frozen deployment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-consumers-completion-${{ needs.prepare-maintenance.outputs.deployment_run_id }}-${{ needs.prepare-maintenance.outputs.deployment_run_attempt }}
          path: frozen-completion
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare-maintenance.outputs.deployment_run_id }}
      - name: Verify deployment, cutover, epoch, and original producer binding
        run: |
          scripts/ci/ci-tool.sh maintenance-publish-evidence "${MAINTENANCE_RECEIPT}" completion \
            < frozen-completion/frozen-consumers-completion.json
          scripts/ci/ci-tool.sh maintenance-publish-evidence "${MAINTENANCE_RECEIPT}" provenance \
            < deployed-provenance/deployment.json
      - name: Publish the resumed deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ needs.prepare-maintenance.outputs.deployment_run_id }}
        run: scripts/ci/publish-runtime-release.sh maintenance "${MAINTENANCE_RECEIPT}"
