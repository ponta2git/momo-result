name: web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm --filter web format:check
        timeout-minutes: 2
      - run: pnpm --filter web lint
        timeout-minutes: 2
      - run: pnpm --filter web contract:check
        timeout-minutes: 2
      - run: pnpm --filter web typecheck
        timeout-minutes: 5

  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Validate Web build checker and E2E runners
        run: pnpm --filter web scripts:check
        timeout-minutes: 2
      - name: Test
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm --filter web test:run
        timeout-minutes: 5
      - name: Test with coverage report
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm --filter web test:coverage
        timeout-minutes: 5
      - name: Install browser for UI contracts
        run: pnpm --filter web exec playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Verify browser UI contracts
        run: pnpm --filter web e2e:ui
        timeout-minutes: 10
      - name: Upload browser UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-ui-report/
            apps/web/test-results-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build structured CI tool
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/setup-ci-tool

      - name: Summarize coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          bash scripts/ci/ci-tool.sh coverage web \
            --root . \
            --out coverage-summary/web \
            --allow-missing
          cat coverage-summary/web/summary.md >> "${GITHUB_STEP_SUMMARY}"
        timeout-minutes: 1
      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/coverage/
            coverage-summary/web/
          if-no-files-found: ignore
          retention-days: 30
