name: Cutover component

on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [runtime, worker]
        required: true
      action:
        type: choice
        options: [state, stop, stage, observe, verify, resume, restore-source]
        required: true
      candidate_sha:
        description: Exact master commit whose verified image was published
        type: string
        required: true
      producer_run_id:
        description: Successful publish-cutover producer run
        type: string
        required: true
      producer_attempt:
        type: string
        required: true
      plan_sha256:
        description: SHA256 of the approved private component plan
        type: string
        required: true
      confirmation:
        description: Enter action-component-candidate_sha
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved candidate and operation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRODUCER_RUN: ${{ inputs.producer_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
          COMPONENT: ${{ inputs.component }}
          OPERATION: ${{ inputs.action }}
        run: |
          test "${GITHUB_REF}" = refs/heads/master
          test "${GITHUB_SHA}" = "${CANDIDATE_SHA}"
          test "${CONFIRMATION}" = "${OPERATION}-${COMPONENT}-${CANDIDATE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = "${CANDIDATE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy/production-mode.json?ref=master" --jq .content | base64 --decode | jq -er .mode)" = cutover
          [[ "${PRODUCER_RUN}" =~ ^[1-9][0-9]*$ && "${PRODUCER_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN}/attempts/${PRODUCER_ATTEMPT}" > "${RUNNER_TEMP}/producer.json"
          jq -e --arg sha "${CANDIDATE_SHA}" '.head_sha == $sha and .event == "push" and .path == ".github/workflows/deploy.yml"' "${RUNNER_TEMP}/producer.json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN}/attempts/${PRODUCER_ATTEMPT}/jobs" --paginate --jq '.jobs[] | select(.name == "publish-cutover") | .conclusion' > "${RUNNER_TEMP}/publication-status"
          test "$(cat "${RUNNER_TEMP}/publication-status")" = success

      - name: Download immutable runtime publication
        if: inputs.component == 'runtime'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}
          name: runtime-deployment-metadata-${{ inputs.producer_run_id }}-${{ inputs.producer_attempt }}
          path: publication

      - name: Download immutable worker publication
        if: inputs.component == 'worker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}
          name: cutover-worker-publication-${{ inputs.producer_run_id }}-${{ inputs.producer_attempt }}
          path: publication

      - name: Materialize approved private plan and bind image provenance
        env:
          COMPONENT: ${{ inputs.component }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          RUNTIME_PLAN: ${{ secrets.CUTOVER_RUNTIME_PLAN }}
          WORKER_PLAN: ${{ secrets.CUTOVER_WORKER_PLAN }}
        run: |
          umask 077
          if [[ "${COMPONENT}" == runtime ]]; then
            printf '%s' "${RUNTIME_PLAN}" > "${RUNNER_TEMP}/component-plan.json"
            registry_ref="$(jq -er .registryRef publication/deployment.json)"
          else
            printf '%s' "${WORKER_PLAN}" > "${RUNNER_TEMP}/component-plan.json"
            registry_ref="$(cat publication/registry-ref.txt)"
          fi
          [[ "${PLAN_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "${RUNNER_TEMP}/component-plan.json" | cut -d' ' -f1)" = "${PLAN_SHA256}"
          jq -e --arg image "${registry_ref}" '.maintenanceConfig.image == $image and .activeConfig.image == $image' "${RUNNER_TEMP}/component-plan.json" >/dev/null

      - name: Set up Fly CLI for boot-bound readiness logs
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Operate one approved component
        env:
          FLY_API_TOKEN: ${{ inputs.component == 'runtime' && secrets.FLY_API_TOKEN || secrets.ANALYSIS_FLY_API_TOKEN }}
          OPERATION: ${{ inputs.action }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = "${CANDIDATE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy/production-mode.json?ref=master" --jq .content | base64 --decode | jq -er .mode)" = cutover
          python3 scripts/ops/cutover-machine.py "${OPERATION}" --plan "${RUNNER_TEMP}/component-plan.json" --output "${RUNNER_TEMP}/component-evidence.json"

      - name: Encrypt private evidence
        if: always()
        env:
          RECIPIENT: ${{ vars.CUTOVER_EVIDENCE_RECIPIENT }}
        run: |
          if [[ -f "${RUNNER_TEMP}/component-evidence.json" ]]; then
            test -n "${RECIPIENT}"
            sudo apt-get update -qq
            sudo apt-get install -y age
            age -r "${RECIPIENT}" -o component-evidence.age "${RUNNER_TEMP}/component-evidence.json"
          fi

      - name: Preserve encrypted operation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cutover-${{ inputs.component }}-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: component-evidence.age
          if-no-files-found: ignore
          retention-days: 30
