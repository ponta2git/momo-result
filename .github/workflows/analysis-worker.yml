name: Analysis worker

on:
  workflow_call:
    inputs:
      package_image:
        description: Package the verified image as an immutable release candidate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  analysis-worker:
    uses: ./.github/workflows/processing-worker.yml
    with:
      package_image: ${{ inputs.package_image }}
