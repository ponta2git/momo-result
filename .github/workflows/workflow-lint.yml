name: workflow-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/actionlint"
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint
        run: scripts/ci/actionlint.sh
      - name: Set up Go tools
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: false
          go-version: 1.26.6
      - name: Test Go and zero-install diagnostic tools
        run: |
          cd tools
          go test ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          ./test-linux-memory-snapshot.sh
      - name: Test workflow policy scripts
        run: |
          scripts/ci/test-classify-changes.sh
          scripts/ci/test-check-pr-ready.sh
          scripts/ci/test-canonicalize-artifact-digest.sh
          scripts/ci/test-validate-analysis-candidate.sh
          scripts/ci/test-validate-analysis-worker-readiness.sh
          scripts/ci/test-load-analysis-candidate.sh
          scripts/ci/test-load-runtime-image-artifact.sh
          scripts/ci/test-resolve-pushed-runtime-image.sh
          scripts/ci/runtime-workflow-contracts.sh
          scripts/ci/test-validate-runtime-release-selection.sh
          scripts/ci/test-runtime-memory-smoke.sh
          scripts/ci/test-sanitize-analysis-report.sh
          scripts/ci/test-validate-runtime-deployment.sh
