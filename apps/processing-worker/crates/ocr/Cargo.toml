[package]
name = "momo-ocr"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
unicode-normalization = "0.1.25"

[lints]
workspace = true
