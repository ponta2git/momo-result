name: web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm --filter web format:check
        timeout-minutes: 2
      - run: pnpm --filter web lint
        timeout-minutes: 2
      - run: pnpm --filter web contract:check
        timeout-minutes: 2
      - run: pnpm --filter web typecheck
        timeout-minutes: 5

  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Test
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm --filter web test:run
        timeout-minutes: 5
      - name: Test with coverage report
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm --filter web test:coverage
        timeout-minutes: 5
      - run: pnpm --filter web build
        timeout-minutes: 5
      - name: Summarize coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          python3 scripts/ci/write-coverage-summary.py web \
            --root . \
            --out coverage-summary/web \
            --allow-missing
          cat coverage-summary/web/summary.md >> "${GITHUB_STEP_SUMMARY}"
        timeout-minutes: 1
      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/coverage/
            coverage-summary/web/
          if-no-files-found: ignore
          retention-days: 30
