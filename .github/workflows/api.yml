name: API

on:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned momo-db revision
        id: momo-db
        working-directory: ${{ github.workspace }}
        run: |
          ref="$(tr -d '\r\n' < .momo-db-ref)"
          [[ "${ref}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid .momo-db-ref." >&2; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout momo-db migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/momo-db
          ref: ${{ steps.momo-db.outputs.ref }}
          path: _deps/momo-db
          token: ${{ github.token }}
          sparse-checkout: drizzle
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      - name: Build fixed http4s Fork artifacts
        working-directory: ${{ github.workspace }}
        run: |
          HTTP4S_REPOSITORY=https://github.com/ponta2git/http4s.git \
            HTTP4S_SCALA_VERSION=3.3.6 \
            HTTP4S_RUN_TESTS=1 \
            HTTP4S_PATCH_OUTPUT_DIR="${RUNNER_TEMP}/http4s-patch" \
            scripts/ci/build-http4s-patch.sh
          printf 'MOMO_HTTP4S_PATCHED_VERSION=%s\n' \
            "$(cat "${RUNNER_TEMP}/http4s-patch/version.txt")" >> "${GITHUB_ENV}"

      - name: Format check
        timeout-minutes: 5
        run: sbt scalafmtCheckAll

      - name: Lint check
        timeout-minutes: 5
        run: sbt "scalafixAll --check"

      - name: Clean test compile
        if: ${{ github.event_name != 'pull_request' }}
        timeout-minutes: 10
        run: sbt clean Test/compile

      - name: Clean production compile
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 10
        run: sbt clean Compile/compile

      - name: OpenAPI generation check
        timeout-minutes: 5
        run: sbt apiOpenApiCheck

      - name: Verify synchronous Scala analysis is absent from the runtime artifact
        timeout-minutes: 5
        run: |
          sbt stage
          ../../scripts/ci/check-api-analysis-engine-absence.sh target/universal/stage

      - name: Test
        if: ${{ github.event_name != 'pull_request' }}
        timeout-minutes: 10
        run: sbt test

      - name: Test with coverage report
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 10
        run: sbt apiTestWithCoverageReportOnly

      - name: DB quality gate
        timeout-minutes: 10
        run: sbt apiDbQuality

      - name: Redis quality gate
        timeout-minutes: 5
        run: sbt apiRedisQuality

      - name: Summarize coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        timeout-minutes: 1
        run: |
          python3 ../../scripts/ci/write-coverage-summary.py api \
            --root ../.. \
            --out ../../coverage-summary/api \
            --allow-missing
          cat ../../coverage-summary/api/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-coverage
          path: |
            apps/api/target/scala-*/scoverage-report/
            apps/api/target/scala-*/coverage-report/
            coverage-summary/api/
          if-no-files-found: ignore
          retention-days: 30
