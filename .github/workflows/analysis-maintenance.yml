name: Continue one frozen analysis campaign

on:
  workflow_dispatch:
    inputs:
      receipt_json:
        description: Reviewed analysis receipt for one existing operation, campaign, and plan digest
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tool
      - uses: ./.github/actions/setup-maintenance-control
      - name: Bind the exact campaign plan to this run
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_INPUT: ${{ inputs.receipt_json }}
        run: |
          umask 077
          printf '%s\n' "${RECEIPT_INPUT}" > receipt-input.json
          scripts/ci/maintenance-control.sh bind-receipt analysis receipt-input.json receipt.json
          scripts/ci/ci-tool.sh maintenance-operation-scope receipt.json analysis > /dev/null
      - name: Upload the immutable receipt for approval
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: analysis-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30

  operate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://momo-result.ponta.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tool
      - uses: ./.github/actions/setup-maintenance-control
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.receipt_artifact_id }}
          path: maintenance-receipt
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79
      - name: Recheck and continue only the bound campaign
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: scripts/ci/continue-maintenance-analysis.sh maintenance-receipt/receipt.json
      - name: Upload bounded campaign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: analysis-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis-maintenance-evidence/
          if-no-files-found: ignore
          retention-days: 30
