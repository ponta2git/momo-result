name: System E2E

on:
  workflow_call:
    inputs:
      runtime_artifact_id:
        required: true
        type: string
      runtime_artifact_digest:
        required: true
        type: string
      runtime_artifact_name:
        required: true
        type: string
      runtime_image_ref:
        required: true
        type: string
      runtime_run_attempt:
        required: true
        type: string
      worker_metadata_id:
        required: true
        type: string
      worker_metadata_digest:
        required: true
        type: string
      worker_metadata_name:
        required: true
        type: string
      worker_run_attempt:
        required: true
        type: string
      controlled_worker_artifact_id:
        required: true
        type: string
      controlled_worker_artifact_digest:
        required: true
        type: string
      controlled_worker_run_attempt:
        required: true
        type: string
      # Built in the Runtime producer job, so it shares runtime_run_attempt.
      session_fixture_artifact_id:
        required: true
        type: string
      session_fixture_artifact_digest:
        required: true
        type: string
  # Manual runs build every input in this job from the same Dockerfile targets and
  # use the same runner checks; they never call the deploy workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned cross-repository revisions
        id: revisions
        run: |
          db_ref="$(tr -d '\r\n' < .momo-db-ref)"
          summit_ref="$(tr -d '\r\n' < .summit-ref)"
          [[ "${db_ref}" =~ ^[0-9a-f]{40}$ && "${summit_ref}" =~ ^[0-9a-f]{40}$ ]]
          printf 'db=%s\nsummit=%s\n' "${db_ref}" "${summit_ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/momo-db
          ref: ${{ steps.revisions.outputs.db }}
          path: _deps/momo-db
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/summit
          ref: ${{ steps.revisions.outputs.summit }}
          path: _deps/summit
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: _deps/summit/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            _deps/momo-db/pnpm-lock.yaml
            _deps/summit/pnpm-lock.yaml
      - name: Build shared schema
        working-directory: _deps/momo-db
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Prepare pinned notification receiver
        working-directory: _deps/summit
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build structured CI tool
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/setup-ci-tool
      - name: Validate exact candidate producer selection
        if: github.event_name != 'workflow_dispatch'
        env:
          RUNTIME_ID: ${{ inputs.runtime_artifact_id }}
          RUNTIME_DIGEST: ${{ inputs.runtime_artifact_digest }}
          RUNTIME_NAME: ${{ inputs.runtime_artifact_name }}
          RUNTIME_REF: ${{ inputs.runtime_image_ref }}
          RUNTIME_ATTEMPT: ${{ inputs.runtime_run_attempt }}
          WORKER_ID: ${{ inputs.worker_metadata_id }}
          WORKER_DIGEST: ${{ inputs.worker_metadata_digest }}
          WORKER_NAME: ${{ inputs.worker_metadata_name }}
          WORKER_ATTEMPT: ${{ inputs.worker_run_attempt }}
          CONTROLLED_WORKER_ID: ${{ inputs.controlled_worker_artifact_id }}
          CONTROLLED_WORKER_DIGEST: ${{ inputs.controlled_worker_artifact_digest }}
          CONTROLLED_WORKER_ATTEMPT: ${{ inputs.controlled_worker_run_attempt }}
          SESSION_FIXTURE_ID: ${{ inputs.session_fixture_artifact_id }}
          SESSION_FIXTURE_DIGEST: ${{ inputs.session_fixture_artifact_digest }}
        run: |
          scripts/ci/ci-tool.sh runtime-release-selection \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${RUNTIME_ATTEMPT}" \
            "${RUNTIME_NAME}" "${RUNTIME_ID}" "${RUNTIME_DIGEST}" "${RUNTIME_REF}"
          scripts/ci/ci-tool.sh analysis-release-selection \
            "${GITHUB_RUN_ID}" "${WORKER_ATTEMPT}" "${WORKER_NAME}" \
            "${WORKER_ID}" "${WORKER_DIGEST}"
          scripts/ci/ci-tool.sh e2e-artifact-selection \
            "${CONTROLLED_WORKER_ATTEMPT}" "${CONTROLLED_WORKER_ID}" "${CONTROLLED_WORKER_DIGEST}"
          scripts/ci/ci-tool.sh e2e-artifact-selection \
            "${RUNTIME_ATTEMPT}" "${SESSION_FIXTURE_ID}" "${SESSION_FIXTURE_DIGEST}"
      - name: Download exact Runtime candidate
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.runtime_artifact_id }}
          path: ${{ inputs.runtime_artifact_name }}
      - name: Load verified Runtime candidate
        if: github.event_name != 'workflow_dispatch'
        env:
          IMAGE_ARTIFACT_NAME: ${{ inputs.runtime_artifact_name }}
          IMAGE_REF: ${{ inputs.runtime_image_ref }}
          RUNTIME_CANDIDATE_RUN_ATTEMPT: ${{ inputs.runtime_run_attempt }}
        run: scripts/ci/load-runtime-image-artifact.sh
      - name: Download exact Worker producer metadata
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.worker_metadata_id }}
          path: system-worker-metadata
      - name: Validate Worker candidate
        if: github.event_name != 'workflow_dispatch'
        id: worker
        env:
          PRODUCER_ATTEMPT: ${{ inputs.worker_run_attempt }}
        run: |
          scripts/ci/ci-tool.sh analysis-candidate \
            system-worker-metadata/candidate.json "${GITHUB_RUN_ID}" "${PRODUCER_ATTEMPT}" "${GITHUB_SHA}" \
            --config fly.analysis.toml >> "${GITHUB_OUTPUT}"
      - name: Download verified Worker image
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.worker.outputs.image_artifact_id }}
          path: system-worker-image
      - name: Load verified Worker candidate
        if: github.event_name != 'workflow_dispatch'
        env:
          CANDIDATE_IMAGE: ${{ steps.worker.outputs.image_ref }}
          CANDIDATE_TAR_SHA: ${{ steps.worker.outputs.tar_sha256 }}
        run: scripts/ci/load-analysis-candidate.sh system-worker-image "${CANDIDATE_IMAGE}" "${CANDIDATE_TAR_SHA}"
      - name: Download controlled E2E worker
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.controlled_worker_artifact_id }}
          path: e2e-controlled-worker
      - name: Download session fixture
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.session_fixture_artifact_id }}
          path: e2e-session-fixture
      - name: Verify and load System E2E test artifacts
        if: github.event_name != 'workflow_dispatch'
        env:
          CONTROLLED_WORKER_DIR: e2e-controlled-worker
          CONTROLLED_WORKER_RUN_ATTEMPT: ${{ inputs.controlled_worker_run_attempt }}
          CONTROLLED_WORKER_ARTIFACT_ID: ${{ inputs.controlled_worker_artifact_id }}
          CONTROLLED_WORKER_ARTIFACT_DIGEST: ${{ inputs.controlled_worker_artifact_digest }}
          SESSION_FIXTURE_DIR: e2e-session-fixture
          SESSION_FIXTURE_RUN_ATTEMPT: ${{ inputs.runtime_run_attempt }}
          SESSION_FIXTURE_ARTIFACT_ID: ${{ inputs.session_fixture_artifact_id }}
          SESSION_FIXTURE_ARTIFACT_DIGEST: ${{ inputs.session_fixture_artifact_digest }}
          RUNTIME_IMAGE: ${{ inputs.runtime_image_ref }}
        run: scripts/ci/load-e2e-artifacts.sh >> "${GITHUB_ENV}"
      - name: Setup Docker Buildx
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build manual Runtime candidate
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          load: true
          tags: momo-system-runtime:manual
          cache-from: type=gha,scope=momo-result-runtime-v1
          cache-to: type=gha,mode=max,scope=momo-result-runtime-v1,ignore-error=true
      - name: Build manual session fixture
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          target: e2e-session-fixture
          outputs: type=local,dest=e2e-session-fixture
          cache-from: type=gha,scope=momo-result-runtime-v1
      - name: Bind manual session fixture to the manual Runtime
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/e2e/record-session-fixture.mts e2e-session-fixture \
            "$(docker image inspect momo-system-runtime:manual --format '{{.Id}}')"
      - name: Build manual Worker candidate
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: apps/processing-worker/Dockerfile
          load: true
          tags: momo-system-worker:manual
          cache-from: type=gha,scope=momo-result-analysis-v1
          cache-to: type=gha,mode=max,scope=momo-result-analysis-v1,ignore-error=true
      - name: Build manual controlled Worker
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: apps/processing-worker/Dockerfile
          target: e2e-test
          load: true
          tags: momo-system-controlled-worker:manual
          cache-from: |
            type=gha,scope=momo-result-ocr-e2e-v1
            type=gha,scope=momo-result-analysis-v1
          cache-to: type=gha,mode=max,scope=momo-result-ocr-e2e-v1,ignore-error=true
      - name: Select already built images for the common environment
        env:
          CANDIDATE_RUNTIME: ${{ inputs.runtime_image_ref }}
          CANDIDATE_WORKER: ${{ steps.worker.outputs.image_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            printf 'MOMO_E2E_RUNTIME_IMAGE=momo-system-runtime:manual\nMOMO_E2E_WORKER_IMAGE=momo-system-worker:manual\n'
            printf 'MOMO_E2E_CONTROLLED_WORKER_IMAGE=momo-system-controlled-worker:manual\n'
            printf 'MOMO_E2E_SESSION_FIXTURE_DIR=%s/e2e-session-fixture\n' "${GITHUB_WORKSPACE}"
          else
            # The controlled Worker and session fixture were selected by the verified load step.
            printf 'MOMO_E2E_RUNTIME_IMAGE=%s\nMOMO_E2E_WORKER_IMAGE=%s\n' "${CANDIDATE_RUNTIME}" "${CANDIDATE_WORKER}"
          fi >> "${GITHUB_ENV}"
      - name: Verify real assembled user journeys
        env:
          MOMO_DB_MIGRATIONS_DIR: ${{ github.workspace }}/_deps/momo-db/drizzle
        run: pnpm e2e
      - name: Verify recovery and system integration contracts
        env:
          MOMO_DB_MIGRATIONS_DIR: ${{ github.workspace }}/_deps/momo-db/drizzle
        run: pnpm e2e:recovery
      - name: Verify pinned notification producer and consumer contract
        env:
          MOMO_DB_MIGRATIONS_DIR: ${{ github.workspace }}/_deps/momo-db/drizzle
        run: pnpm test:notification-contract
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: system-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-system-report/
            apps/web/playwright-recovery-report/
            apps/web/playwright-contracts-report/
            apps/web/test-results-system/
            apps/web/test-results-recovery/
            apps/web/test-results-contracts/
          if-no-files-found: ignore
          retention-days: 7
