name: workflow-lint

on:
  workflow_call:
    inputs:
      actionlint:
        required: false
        default: true
        type: boolean
      go_tools:
        required: false
        default: true
        type: boolean
      policy_scripts:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.actionlint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/actionlint"
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint
        run: scripts/ci/actionlint.sh

  go-tools:
    name: Go tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.go_tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: tools/go.sum
          go-version: 1.26.6
      - name: Test Go and zero-install diagnostic tools
        run: |
          cd tools
          go test ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          ./test-linux-memory-snapshot.sh

  policy-scripts:
    name: Policy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.policy_scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test workflow policy scripts
        run: |
          bash -n scripts/ci/*.sh
          node --test scripts/dev-local.test.mjs
          for test_script in scripts/ci/test-*.sh; do
            "${test_script}"
          done
