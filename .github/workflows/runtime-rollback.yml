name: Runtime rollback

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Successful deploy workflow run ID to restore
        required: true
        type: string
      confirmation:
        description: Enter rollback-<target_run_id>
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate rollback request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
        run: |
          [[ "${GITHUB_REF}" == "refs/heads/master" ]] || {
            echo "Runtime rollback must run from master." >&2
            exit 1
          }
          [[ "${TARGET_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || {
            echo "A valid target deploy run ID is required." >&2
            exit 1
          }
          [[ "${CONFIRMATION}" == "rollback-${TARGET_RUN_ID}" ]] || {
            echo "Rollback confirmation does not match the target run ID." >&2
            exit 1
          }

  resolve-target:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.provenance.outputs.candidate_sha }}
      config_sha256: ${{ steps.provenance.outputs.config_sha256 }}
      manifest_artifact_digest: ${{ steps.provenance.outputs.manifest_artifact_digest }}
      manifest_artifact_id: ${{ steps.provenance.outputs.manifest_artifact_id }}
      manifest_artifact_name: ${{ steps.provenance.outputs.manifest_artifact_name }}
      manifest_sha256: ${{ steps.provenance.outputs.manifest_sha256 }}
      registry_ref: ${{ steps.provenance.outputs.registry_ref }}
      target_run_attempt: ${{ steps.run.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build structured CI tool
        uses: ./.github/actions/setup-ci-tool

      - name: Resolve successful deployment run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
        run: |
          run_json="${RUNNER_TEMP}/runtime-deploy-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > "${run_json}"
          selection="$(scripts/ci/ci-tool.sh resolve-deployment-run "${GITHUB_REPOSITORY}" < "${run_json}")"
          candidate_sha="$(sed -n 's/^candidate_sha=//p' <<< "${selection}")"
          run_attempt="$(sed -n 's/^run_attempt=//p' <<< "${selection}")"
          git merge-base --is-ancestor "${candidate_sha}" "${GITHUB_SHA}" || {
            echo "The rollback target is not an ancestor of current master." >&2
            exit 1
          }
          printf 'candidate_sha=%s\n' "${candidate_sha}" >> "${GITHUB_OUTPUT}"
          printf 'run_attempt=%s\n' "${run_attempt}" >> "${GITHUB_OUTPUT}"

      - name: Download deployment provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-deployment-metadata-${{ inputs.target_run_id }}-${{ steps.run.outputs.run_attempt }}
          path: runtime-deployment-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.target_run_id }}

      - name: Validate deployment provenance
        id: provenance
        env:
          CANDIDATE_SHA: ${{ steps.run.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ steps.run.outputs.run_attempt }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
        run: |
          metadata="runtime-deployment-metadata/deployment.json"
          target_config="${RUNNER_TEMP}/rollback-fly.toml"
          git show "${CANDIDATE_SHA}:fly.toml" > "${target_config}"
          selection="$(scripts/ci/ci-tool.sh runtime-deployment \
            "${metadata}" "${TARGET_RUN_ID}" "${RUN_ATTEMPT}" "${CANDIDATE_SHA}" --config "${target_config}")"
          artifact_id="$(sed -n 's/^manifest_artifact_id=//p' <<< "${selection}")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" | \
            scripts/ci/ci-tool.sh verify-manifest-artifact "${metadata}" "${TARGET_RUN_ID}"
          printf '%s\n' "${selection}" >> "${GITHUB_OUTPUT}"

  rollback:
    needs:
      - validate
      - resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://momo-result.ponta.me
    env:
      REGISTRY_REF: ${{ needs.resolve-target.outputs.registry_ref }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go runtime tool
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: apps/runtime/go.mod

      - name: Reject ordinary production operation during cutover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          control="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy/production-mode.json?ref=master" --jq .content | base64 --decode | jq -er .mode)"
          test "${control}" = active || { echo 'Ordinary production operation is disabled during cutover.' >&2; exit 1; }

      - name: Build structured CI tool
        run: |
          scripts/ci/build-ci-tool.sh "${RUNNER_TEMP}/ci-tool"
          printf 'MOMO_CI_TOOL=%s\n' "${RUNNER_TEMP}/ci-tool" >> "${GITHUB_ENV}"

      - name: Download deployed registry manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.resolve-target.outputs.manifest_artifact_name }}
          path: rollback-manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.target_run_id }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79

      - name: Restore and validate exact target config
        env:
          EXPECTED_CONFIG_SHA256: ${{ needs.resolve-target.outputs.config_sha256 }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          git show "${TARGET_SHA}:fly.toml" > "${RUNNER_TEMP}/rollback-fly.toml"
          scripts/ci/ci-tool.sh file-digest-match "${RUNNER_TEMP}/rollback-fly.toml" "${EXPECTED_CONFIG_SHA256}"
          flyctl config validate --strict --config "${RUNNER_TEMP}/rollback-fly.toml"

      - name: Authenticate Docker to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Verify immutable registry image
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.resolve-target.outputs.manifest_sha256 }}
        run: |
          mkdir -p runtime-rollback-evidence
          scripts/ci/ci-tool.sh file-digest-match rollback-manifest/registry-manifest.json "${EXPECTED_MANIFEST_SHA256}"
          docker manifest inspect "${REGISTRY_REF}" | scripts/ci/ci-tool.sh canonical-json \
            > "${RUNNER_TEMP}/current-registry-manifest.json"
          scripts/ci/ci-tool.sh file-digest-match "${RUNNER_TEMP}/current-registry-manifest.json" "${EXPECTED_MANIFEST_SHA256}"
          printf '%s\n' '{"schemaVersion":1,"manifestVerified":true}' \
            > runtime-rollback-evidence/registry-verification.json

      - name: Deploy exact rollback target
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy
          --config "${RUNNER_TEMP}/rollback-fly.toml"
          --image "${REGISTRY_REF}"
          --yes

      - name: Verify restored image identity
        id: deployment-state
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          machines_json="$(flyctl machine list --app momo-result --json)"
          scripts/ci/ci-tool.sh runtime-machine-evidence "${REGISTRY_REF}" <<< "${machines_json}" \
            > runtime-rollback-evidence/deployment-state.json
          machine_id="$(scripts/ci/ci-tool.sh runtime-machine-id "${REGISTRY_REF}" <<< "${machines_json}")"
          printf 'machine_id=%s\n' "${machine_id}" >> "${GITHUB_OUTPUT}"
        timeout-minutes: 2

      - name: Run rollback internal dependency and process smoke
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console --app momo-result --pty=false --quiet \
            --command "env MOMO_POSTDEPLOY_PUBLIC_EDGE=deferred /opt/momo-result/bin/momo-runtime-tool smoke local" \
            > runtime-rollback-evidence/postdeploy-smoke.json
          scripts/ci/ci-tool.sh postdeploy-evidence \
            "${GITHUB_WORKSPACE}/runtime-rollback-evidence/postdeploy-smoke.json" \
            > /dev/null
        timeout-minutes: 2

      - name: Build current public edge probe
        run: |
          cd apps/runtime
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o "${RUNNER_TEMP}/momo-runtime-tool" ./cmd/momo-runtime-tool

      - name: Upload current public edge probe to restored runtime
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl ssh sftp put
          --app momo-result
          --machine "${{ steps.deployment-state.outputs.machine_id }}"
          --mode 0500
          "${RUNNER_TEMP}/momo-runtime-tool"
          /tmp/momo-runtime-tool
        timeout-minutes: 1

      - name: Verify public edge from restored runtime
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console --app momo-result --pty=false --quiet \
            --machine "${{ steps.deployment-state.outputs.machine_id }}" \
            --command "/tmp/momo-runtime-tool smoke edge momo-result.ponta.me" \
            > "${RUNNER_TEMP}/runtime-public-edge.json"
          scripts/ci/ci-tool.sh public-edge-evidence < "${RUNNER_TEMP}/runtime-public-edge.json" \
            > runtime-rollback-evidence/public-health.json
        timeout-minutes: 1

      - name: Remove temporary public edge probe
        if: always() && steps.deployment-state.outputs.machine_id != ''
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl ssh console
          --app momo-result
          --pty=false
          --quiet
          --machine "${{ steps.deployment-state.outputs.machine_id }}"
          --command "rm -f /tmp/momo-runtime-tool"
        timeout-minutes: 1

      - name: Upload rollback verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-rollback-evidence/
          if-no-files-found: ignore
          retention-days: 30
