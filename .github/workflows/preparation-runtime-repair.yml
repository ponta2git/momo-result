name: Prepare the fixed P0 Runtime proof repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build the fixed candidate, or deploy the already verified candidate
        required: true
        type: choice
        options: [candidate, deploy]
      receipt:
        description: Deploy only; the reviewed preparation receipt without execution
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  candidate:
    if: inputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      MOMO_DB_TEST_DATABASE: momo_db_test_preparation_runtime
      MOMO_DB_TEST_HOST: 127.0.0.1
      MOMO_DB_TEST_PORT: '5432'
      MOMO_DB_TEST_USER: postgres
      MOMO_DB_TEST_PASSWORD: postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: momo_db_test_preparation_runtime
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d momo_db_test_preparation_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Read the reviewed source and control pins
        id: pins
        run: node scripts/ci/preparation-runtime-repair.mjs workflow-config >> "${GITHUB_OUTPUT}"
      - name: Checkout the immutable preparation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ steps.pins.outputs.controlSha }}
          path: _deps/momo-maintenance-control
          sparse-checkout: |
            scripts/maintenance
            scripts/migration
          persist-credentials: false
      - name: Require untouched PREPARING on the exact cutover branch
        run: node scripts/ci/preparation-runtime-deploy.mjs candidate-context _deps/momo-maintenance-control
      - name: Checkout the fixed ten-file repair over P0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pins.outputs.sourceSha }}
          path: repair-source
          fetch-depth: 0
          persist-credentials: false
      - name: Check every source byte, parent, tree, and consumer pin
        run: node scripts/ci/preparation-runtime-repair.mjs source repair-source
      - name: Checkout the P0 DB owner and its migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ steps.pins.outputs.databaseSha }}
          path: repair-source/_deps/momo-db
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
      - name: Build and test the source-pinned http4s patch
        working-directory: repair-source
        env:
          HTTP4S_REPOSITORY: https://github.com/ponta2git/http4s.git
          HTTP4S_SCALA_VERSION: 3.3.6
          HTTP4S_RUN_TESTS: '1'
          HTTP4S_PATCH_OUTPUT_DIR: ${{ runner.temp }}/repair-http4s-patch
        run: |
          scripts/ci/build-http4s-patch.sh
          printf 'MOMO_HTTP4S_PATCHED_VERSION=%s\n' \
            "$(cat "${HTTP4S_PATCH_OUTPUT_DIR}/version.txt")" >> "${GITHUB_ENV}"
        timeout-minutes: 20
      - name: Check API quality and all affected tests at the repair source
        working-directory: repair-source/apps/api
        run: sbt --server --batch apiQuality testFull
        timeout-minutes: 25
      - name: Check API PostgreSQL contracts against the P0 DB pin
        working-directory: repair-source/apps/api
        run: |
          node scripts/generate-identity-schema-contract.mjs ../../_deps/momo-db/drizzle --check
          sbt --server --batch apiDbQuality
        timeout-minutes: 20
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: repair-source/apps/runtime/go.mod
          cache-dependency-path: repair-source/apps/runtime/go.sum
      - name: Check all Runtime Go tests, formatting, vet, and vulnerabilities
        working-directory: repair-source/apps/runtime
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
        timeout-minutes: 10
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: repair-source/package.json
      - name: Verify the unchanged source Web contracts and tests
        working-directory: repair-source
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web format:check
          pnpm --filter web lint
          pnpm --filter web contract:check
          pnpm --filter web typecheck
          pnpm --filter web scripts:check
          pnpm --filter web test:run
        timeout-minutes: 15
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: repair-source/_deps/momo-db/package.json
      - name: Prepare the dedicated CI database using its pinned owner migrator
        working-directory: repair-source/_deps/momo-db
        run: |
          pnpm install --frozen-lockfile
          pnpm test:prepare
        timeout-minutes: 5
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.73.0
      - name: Check the source Dockerfile policies
        working-directory: repair-source
        run: scripts/ci/dockerfile-lint.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build only the fixed Runtime source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: repair-source
          file: repair-source/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.pins.outputs.imageTag }}
          cache-from: type=gha,scope=preparation-runtime-repair-v1
          cache-to: type=gha,mode=max,scope=preparation-runtime-repair-v1,ignore-error=true
        timeout-minutes: 45
      - name: Scan the exact candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.pins.outputs.imageTag }}
          version: v0.73.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
      - name: Validate the source Runtime executable layout
        working-directory: repair-source
        env:
          IMAGE_REF: ${{ steps.pins.outputs.imageTag }}
          MOMO_ORIGIN_LOCK_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: scripts/ci/validate-runtime-image.sh
      - name: Check normal and frozen boots with the actual P0 Drizzle ledger
        run: >-
          node scripts/ci/preparation-runtime-smoke.mjs repair-source
          _deps/momo-maintenance-control preparation-runtime-image
        timeout-minutes: 10
      - name: Save and verify the immutable candidate
        env:
          IMAGE_REF: ${{ steps.pins.outputs.imageTag }}
        run: |
          umask 077
          docker image save "${IMAGE_REF}" | gzip -1 > preparation-runtime-image/momo-result-image.tar.gz
          node scripts/ci/preparation-runtime-repair.mjs create-candidate preparation-runtime-image repair-source
          node scripts/ci/preparation-runtime-repair.mjs verify-loaded \
            preparation-runtime-image "${RUNNER_TEMP}/repair-producer-captures"
        timeout-minutes: 15
      - name: Recheck the preparation control state
        run: node scripts/ci/preparation-runtime-deploy.mjs candidate-context _deps/momo-maintenance-control
      - name: Upload the fixed Runtime candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preparation-runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: preparation-runtime-image/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  bind:
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      receipt_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ secrets.PREPARATION_GITHUB_OBSERVER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: pins
        run: node scripts/ci/preparation-runtime-repair.mjs workflow-config >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ steps.pins.outputs.controlSha }}
          path: _deps/momo-maintenance-control
          sparse-checkout: |
            scripts/maintenance
            scripts/migration
          persist-credentials: false
      - name: Bind the reviewed receipt to this exact execution
        env:
          REPAIR_RECEIPT_INPUT: ${{ inputs.receipt }}
        run: node scripts/ci/preparation-runtime-deploy.mjs bind _deps/momo-maintenance-control preparation-receipt
      - name: Publish the bound receipt for the operator grant
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preparation-runtime-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: preparation-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: bind
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://momo-result.ponta.me
    env:
      GH_TOKEN: ${{ secrets.PREPARATION_GITHUB_OBSERVER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: pins
        run: node scripts/ci/preparation-runtime-repair.mjs workflow-config >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ steps.pins.outputs.controlSha }}
          path: _deps/momo-maintenance-control
          sparse-checkout: |
            scripts/maintenance
            scripts/migration
          persist-credentials: false
      - name: Download this execution's bound receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.bind.outputs.receipt_id }}
          path: preparation-receipt
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79
      - name: Update only Runtime under the exact preparation grant
        env:
          PREPARATION_OBSERVER_FLY_API_TOKEN: ${{ secrets.PREPARATION_OBSERVER_FLY_API_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANALYSIS_FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
          SUMMIT_PREPARATION_EXEC_TOKEN: ${{ secrets.SUMMIT_PREPARATION_EXEC_TOKEN }}
        run: >-
          node scripts/ci/preparation-runtime-deploy.mjs deploy _deps/momo-maintenance-control
          preparation-receipt/receipt.json preparation-runtime-deployment
      - name: Upload verified normal Runtime deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preparation-runtime-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: preparation-runtime-deployment/
          if-no-files-found: error
          retention-days: 7
