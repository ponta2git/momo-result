name: OCR worker

on:
  workflow_call:
  pull_request:
    paths:
      - "apps/ocr-worker/**"
      - "docs/schemas/**"
      - ".github/workflows/ocr-worker.yml"

permissions:
  contents: read

jobs:
  ocr-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ocr-worker

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout momo-db migrations
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/momo-db
          ref: c6a657e6eb7e9024fabb0ce85aaf0f22d4148f7b
          path: _deps/momo-db
          token: ${{ secrets.MOMO_DB_READ_TOKEN || github.token }}
          sparse-checkout: drizzle
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install OCR test data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr-eng
        timeout-minutes: 5

      - name: Install dependencies
        run: uv sync --locked
        timeout-minutes: 5

      - name: Format check
        run: uv run ruff format --check .
        timeout-minutes: 2

      - name: Lint check
        run: uv run ruff check .
        timeout-minutes: 2

      - name: Type check
        run: uv run mypy
        timeout-minutes: 5

      - name: Test
        if: ${{ github.event_name != 'pull_request' }}
        run: uv run pytest
        timeout-minutes: 10

      - name: Test with coverage report
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          uv run pytest
          --cov
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-report=html:htmlcov
          --cov-fail-under=0
        timeout-minutes: 10

      - name: Summarize coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          python3 ../../scripts/ci/write-coverage-summary.py ocr-worker \
            --root ../.. \
            --out ../../coverage-summary/ocr-worker \
            --allow-missing
          cat ../../coverage-summary/ocr-worker/summary.md >> "${GITHUB_STEP_SUMMARY}"
        timeout-minutes: 1

      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: ocr-worker-coverage
          path: |
            apps/ocr-worker/coverage.xml
            apps/ocr-worker/coverage.json
            apps/ocr-worker/htmlcov/
            coverage-summary/ocr-worker/
          if-no-files-found: ignore
          retention-days: 30

      - name: Integration test
        run: uv run pytest -m integration
        timeout-minutes: 15
