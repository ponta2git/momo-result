name: OCR worker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ocr-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ocr-worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned momo-db revision
        id: momo-db
        working-directory: ${{ github.workspace }}
        run: |
          ref="$(tr -d '\r\n' < .momo-db-ref)"
          [[ "${ref}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid .momo-db-ref." >&2; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout momo-db migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/momo-db
          ref: ${{ steps.momo-db.outputs.ref }}
          path: _deps/momo-db
          token: ${{ github.token }}
          sparse-checkout: drizzle
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: |
            apps/ocr-worker/pyproject.toml
            apps/ocr-worker/uv.lock
          cache-python: true
          cache-suffix: uv-0.11.23
          enable-cache: true
          python-version: "3.14"
          version: "0.11.23"

      - name: Install OCR test data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr-eng
        timeout-minutes: 5

      - name: Install dependencies
        run: uv sync --locked
        timeout-minutes: 5

      - name: Format check
        run: uv run ruff format --check .
        timeout-minutes: 2

      - name: Lint check
        run: uv run ruff check .
        timeout-minutes: 2

      - name: Type check
        run: uv run mypy
        timeout-minutes: 5

      - name: Test
        if: ${{ github.event_name != 'pull_request' }}
        run: uv run pytest
        timeout-minutes: 10

      - name: Test with coverage report
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          uv run pytest
          --cov
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-report=html:htmlcov
          --cov-fail-under=0
        timeout-minutes: 10

      - name: Summarize coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          python3 ../../scripts/ci/write-coverage-summary.py ocr-worker \
            --root ../.. \
            --out ../../coverage-summary/ocr-worker \
            --allow-missing
          cat ../../coverage-summary/ocr-worker/summary.md >> "${GITHUB_STEP_SUMMARY}"
        timeout-minutes: 1

      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ocr-worker-coverage
          path: |
            apps/ocr-worker/coverage.xml
            apps/ocr-worker/coverage.json
            apps/ocr-worker/htmlcov/
            coverage-summary/ocr-worker/
          if-no-files-found: ignore
          retention-days: 30

      - name: Integration test
        run: uv run pytest -m integration
        timeout-minutes: 15
