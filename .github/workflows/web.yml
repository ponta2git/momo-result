name: web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm --filter web format:check
        timeout-minutes: 2
      - run: pnpm --filter web lint
        timeout-minutes: 2
      - run: pnpm --filter web typecheck
        timeout-minutes: 5
      - name: Test
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm --filter web test:run
        timeout-minutes: 5
      - name: Test with coverage report
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm --filter web test:coverage:report
        timeout-minutes: 5
      - name: Summarize coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          python3 scripts/ci/write-coverage-summary.py web \
            --root . \
            --out coverage-summary/web \
            --allow-missing
          cat coverage-summary/web/summary.md >> "${GITHUB_STEP_SUMMARY}"
        timeout-minutes: 1
      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-coverage
          path: |
            apps/web/coverage/
            coverage-summary/web/
          if-no-files-found: ignore
          retention-days: 30
      - run: pnpm --filter web build
        timeout-minutes: 5
