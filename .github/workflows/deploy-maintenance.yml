name: Stage frozen consumers

on:
  workflow_dispatch:
    inputs:
      receipt_json:
        description: Reviewed consumers receipt containing only public identities and evidence digests
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      producer_run_id: ${{ steps.candidate.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.candidate.outputs.producer_run_attempt }}
      runtime_artifact_id: ${{ steps.candidate.outputs.runtime_artifact_id }}
      runtime_artifact_digest: ${{ steps.candidate.outputs.runtime_artifact_digest }}
      runtime_artifact_name: ${{ steps.candidate.outputs.runtime_artifact_name }}
      runtime_image_ref: ${{ steps.candidate.outputs.runtime_image_ref }}
      worker_metadata_id: ${{ steps.candidate.outputs.worker_metadata_id }}
      worker_metadata_digest: ${{ steps.candidate.outputs.worker_metadata_digest }}
      worker_metadata_name: ${{ steps.candidate.outputs.worker_metadata_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tool
      - uses: ./.github/actions/setup-maintenance-control
      - name: Bind this run and resolve the reviewed producer artifacts
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_INPUT: ${{ inputs.receipt_json }}
        run: |
          umask 077
          printf '%s\n' "${RECEIPT_INPUT}" > receipt-input.json
          scripts/ci/maintenance-control.sh bind-receipt consumers receipt-input.json receipt.json
          scripts/ci/maintenance-candidates.sh receipt.json >> "${GITHUB_OUTPUT}"
      - name: Upload the immutable receipt for approval
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumers-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: prepare
    uses: ./.github/workflows/runtime-deploy.yml
    with:
      deployment_mode: frozen
      receipt_artifact_id: ${{ needs.prepare.outputs.receipt_artifact_id }}
      producer_run_id: ${{ needs.prepare.outputs.producer_run_id }}
      runtime_artifact_id: ${{ needs.prepare.outputs.runtime_artifact_id }}
      runtime_artifact_digest: ${{ needs.prepare.outputs.runtime_artifact_digest }}
      runtime_artifact_name: ${{ needs.prepare.outputs.runtime_artifact_name }}
      runtime_image_ref: ${{ needs.prepare.outputs.runtime_image_ref }}
      runtime_run_attempt: ${{ needs.prepare.outputs.producer_run_attempt }}
      worker_metadata_id: ${{ needs.prepare.outputs.worker_metadata_id }}
      worker_metadata_digest: ${{ needs.prepare.outputs.worker_metadata_digest }}
      worker_metadata_name: ${{ needs.prepare.outputs.worker_metadata_name }}
      worker_run_attempt: ${{ needs.prepare.outputs.producer_run_attempt }}
    secrets: inherit
