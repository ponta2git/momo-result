name: deploy

on:
  workflow_call:
    inputs:
      package_image:
        description: Package the verified candidate for the system E2E consumer
        required: false
        default: false
        type: boolean
    outputs:
      artifact_id:
        value: ${{ jobs.runtime-image.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.runtime-image.outputs.artifact_digest }}
      artifact_name:
        value: ${{ jobs.runtime-image.outputs.artifact_name }}
      image_ref:
        value: ${{ jobs.runtime-image.outputs.image_ref }}
      run_attempt:
        value: ${{ jobs.runtime-image.outputs.run_attempt }}
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CI_DUMMY_ORIGIN_LOCK_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  IMAGE_ARTIFACT_NAME: runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
  IMAGE_REF: registry.fly.io/momo-result:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  scope:
    name: Classify runtime release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      http4s_patch: ${{ steps.changes.outputs.http4s_patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify release scope
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # The PR orchestrator invokes this workflow only after classifying
            # the change as runtime-relevant.
            result=$'api=false\nweb=false\nanalysis=false\nanalysis_image=false\nruntime=true\nhttp4s_patch=false'
          elif [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            result=$'api=true\nweb=true\nanalysis=true\nanalysis_image=true\nruntime=true\nhttp4s_patch=true'
          else
            result="$(scripts/ci/classify-git-range.sh "${BASE_SHA}" "${HEAD_SHA}")"
            # Every master push is a runtime release boundary. Path
            # classification still selects the additional patch-specific gate.
            result="${result//runtime=false/runtime=true}"
          fi
          printf '%s\n' "${result}" >> "${GITHUB_OUTPUT}"

  public-safety:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/public-safety.yml

  workflow-lint:
    needs: scope
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/workflow-lint.yml

  api:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/api.yml
    with:
      test_http4s_patch: ${{ needs.scope.outputs.http4s_patch == 'true' }}

  web:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/web.yml

  analysis-candidate:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/processing-worker.yml
    with:
      package_image: true

  dockerfile-lint:
    name: Lint Dockerfiles
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.73.0

      - name: Report and gate Dockerfile findings
        run: scripts/ci/dockerfile-lint.sh

  runtime-image:
    name: Build, scan, smoke, and package runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    outputs:
      artifact_digest: ${{ steps.image-upload.outputs.artifact-digest }}
      artifact_id: ${{ steps.image-upload.outputs.artifact-id }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      image_ref: ${{ steps.candidate.outputs.image_ref }}
      run_attempt: ${{ steps.candidate.outputs.run_attempt }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: momo_result
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d momo_result"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/momo_result
      DEV_MEMBER_IDS: member_ponta,member_akane_mami,member_otaka,member_eu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned momo-db revision
        id: momo-db
        run: |
          ref="$(tr -d '\r\n' < .momo-db-ref)"
          [[ "${ref}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid .momo-db-ref." >&2; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout momo-db migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/momo-db
          ref: ${{ steps.momo-db.outputs.ref }}
          path: _deps/momo-db
          token: ${{ github.token }}
          sparse-checkout: drizzle
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true

      - name: Apply momo-db migrations
        env:
          MOMO_DB_BOOTSTRAP_IS_FRESH: "true"
          MOMO_DB_BOOTSTRAP_PROFILE: web-e2e
        run: scripts/ci/apply-momo-db-migrations.sh
        timeout-minutes: 5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          cache-from: type=gha,scope=momo-result-runtime-v1
          cache-to: type=gha,mode=max,scope=momo-result-runtime-v1,ignore-error=true
          context: .
          load: true
          tags: ${{ env.IMAGE_REF }}
        timeout-minutes: 45

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_REF }}
          version: v0.73.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Validate runtime executables
        run: scripts/ci/validate-runtime-image.sh
        env:
          MOMO_ORIGIN_LOCK_TOKEN: ${{ env.CI_DUMMY_ORIGIN_LOCK_TOKEN }}

      - name: Build structured CI tool
        continue-on-error: true
        uses: ./.github/actions/setup-ci-tool

      - name: Start runtime container
        run: scripts/ci/start-runtime-container.sh
        env:
          IMAGE_UPLOAD_STORAGE_MAX_USED_PERCENT: "100"
          IMAGE_UPLOAD_STORAGE_MIN_FREE_BYTES: "1"
          MOMO_ORIGIN_LOCK_TOKEN: ${{ env.CI_DUMMY_ORIGIN_LOCK_TOKEN }}
          MUTATION_RATE_LIMIT_PER_MINUTE: "240"
          MUTATION_ATTEMPT_RATE_LIMIT_PER_MINUTE: "720"
          # The isolated memory probe must exercise accepted reads, not rate-limit responses.
          READ_API_RATE_LIMIT_PER_MINUTE: "3600"
          RUNTIME_CPU_LIMIT: "2"
          RUNTIME_MEMORY_LIMIT: "512m"
        timeout-minutes: 3

      - name: Release DB contract preflight
        run: docker exec momo-result-runtime /opt/momo-result/bin/momo-runtime-tool preflight
        timeout-minutes: 1

      - name: Runtime HTTP smoke
        run: node scripts/e2e/runtime-smoke.mts
        env:
          MOMO_ORIGIN_LOCK_TOKEN: ${{ env.CI_DUMMY_ORIGIN_LOCK_TOKEN }}
        timeout-minutes: 2

      - name: Runtime memory headroom smoke
        if: github.event_name != 'pull_request'
        run: scripts/ci/runtime-memory-smoke.sh
        env:
          MOMO_ORIGIN_LOCK_TOKEN: ${{ env.CI_DUMMY_ORIGIN_LOCK_TOKEN }}
        timeout-minutes: 3

      - name: Graceful runtime shutdown smoke
        run: scripts/ci/runtime-shutdown-smoke.sh
        timeout-minutes: 2

      - name: Capture safe runtime diagnostics
        if: failure()
        run: >-
          docker logs momo-result-runtime 2>&1 |
          scripts/ci/ci-tool.sh runtime-logs > runtime-container-summary.json || true

      - name: Upload safe runtime diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-container-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop runtime container
        if: always()
        run: docker rm -f momo-result-runtime || true

      - name: Record runtime image identity
        if: github.event_name != 'pull_request' || inputs.package_image
        run: |
          mkdir -p "${IMAGE_ARTIFACT_NAME}"
          printf "%s\n" "${IMAGE_REF}" > "${IMAGE_ARTIFACT_NAME}/image-ref.txt"
          docker image inspect "${IMAGE_REF}" --format '{{.Id}}' > "${IMAGE_ARTIFACT_NAME}/image-id.txt"
          http4s_repository="$(docker run --rm --entrypoint /usr/bin/cat "${IMAGE_REF}" \
            /opt/momo-result/contracts/http4s-patch/repository.txt)"
          http4s_source_sha="$(docker run --rm --entrypoint /usr/bin/cat "${IMAGE_REF}" \
            /opt/momo-result/contracts/http4s-patch/source-sha.txt)"
          http4s_version="$(docker run --rm --entrypoint /usr/bin/cat "${IMAGE_REF}" \
            /opt/momo-result/contracts/http4s-patch/version.txt)"
          http4s_scala_version="$(docker run --rm --entrypoint /usr/bin/cat "${IMAGE_REF}" \
            /opt/momo-result/contracts/http4s-patch/scala-version.txt)"
          scripts/ci/ci-tool.sh create-http4s-patch \
            --repository "${http4s_repository}" --scala-version "${http4s_scala_version}" \
            --source-sha "${http4s_source_sha}" --version "${http4s_version}" \
            > "${IMAGE_ARTIFACT_NAME}/http4s-patch.json"

      - name: Save runtime image
        if: github.event_name != 'pull_request' || inputs.package_image
        run: |
          docker save "${IMAGE_REF}" | gzip -1 > "${IMAGE_ARTIFACT_NAME}/momo-result-image.tar.gz"
          sha256sum "${IMAGE_ARTIFACT_NAME}/momo-result-image.tar.gz" \
            > "${IMAGE_ARTIFACT_NAME}/image-tar.sha256"
        timeout-minutes: 10

      - name: Record runtime candidate provenance
        if: github.event_name != 'pull_request' || inputs.package_image
        id: candidate
        run: |
          scripts/ci/ci-tool.sh create-runtime-candidate \
            --artifact-dir "${IMAGE_ARTIFACT_NAME}" --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --commit "${GITHUB_SHA}" \
            --image-ref "${IMAGE_REF}" > "${IMAGE_ARTIFACT_NAME}/candidate.json"
          {
            printf 'artifact_name=%s\n' "${IMAGE_ARTIFACT_NAME}"
            printf 'image_ref=%s\n' "${IMAGE_REF}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload runtime image
        if: github.event_name != 'pull_request' || inputs.package_image
        id: image-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: ${{ env.IMAGE_ARTIFACT_NAME }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  system-e2e:
    name: Verify assembled system candidate
    needs: [runtime-image, analysis-candidate]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/system-e2e.yml
    with:
      runtime_artifact_id: ${{ needs.runtime-image.outputs.artifact_id }}
      runtime_artifact_digest: ${{ needs.runtime-image.outputs.artifact_digest }}
      runtime_artifact_name: ${{ needs.runtime-image.outputs.artifact_name }}
      runtime_image_ref: ${{ needs.runtime-image.outputs.image_ref }}
      runtime_run_attempt: ${{ needs.runtime-image.outputs.run_attempt }}
      worker_metadata_id: ${{ needs.analysis-candidate.outputs.metadata_artifact_id }}
      worker_metadata_digest: ${{ needs.analysis-candidate.outputs.metadata_artifact_digest }}
      worker_metadata_name: ${{ needs.analysis-candidate.outputs.metadata_artifact_name }}
      worker_run_attempt: ${{ needs.analysis-candidate.outputs.producer_run_attempt }}

  release-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - analysis-candidate
      - workflow-lint
      - public-safety
      - api
      - web
      - dockerfile-lint
      - runtime-image
      - system-e2e
    if: github.event_name != 'pull_request'
    env:
      IMAGE_REF: ${{ needs.runtime-image.outputs.image_ref }}
      RUNTIME_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.runtime-image.outputs.artifact_digest }}
      RUNTIME_CANDIDATE_ARTIFACT_ID: ${{ needs.runtime-image.outputs.artifact_id }}
      RUNTIME_CANDIDATE_ARTIFACT_NAME: ${{ needs.runtime-image.outputs.artifact_name }}
      RUNTIME_CANDIDATE_RUN_ATTEMPT: ${{ needs.runtime-image.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build structured CI tool
        uses: ./.github/actions/setup-ci-tool

      - name: Validate exact release candidate selection
        run: |
          scripts/ci/ci-tool.sh runtime-release-selection \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${RUNTIME_CANDIDATE_RUN_ATTEMPT}" \
            "${RUNTIME_CANDIDATE_ARTIFACT_NAME}" "${RUNTIME_CANDIDATE_ARTIFACT_ID}" \
            "${RUNTIME_CANDIDATE_ARTIFACT_DIGEST}" "${IMAGE_REF}"

      - name: Validate exact worker producer selection
        env:
          METADATA_ID: ${{ needs.analysis-candidate.outputs.metadata_artifact_id }}
          METADATA_NAME: ${{ needs.analysis-candidate.outputs.metadata_artifact_name }}
          METADATA_DIGEST: ${{ needs.analysis-candidate.outputs.metadata_artifact_digest }}
          PRODUCER_ATTEMPT: ${{ needs.analysis-candidate.outputs.producer_run_attempt }}
        run: |
          scripts/ci/ci-tool.sh analysis-release-selection \
            "${GITHUB_RUN_ID}" "${PRODUCER_ATTEMPT}" "${METADATA_NAME}" \
            "${METADATA_ID}" "${METADATA_DIGEST}"

      - name: Confirm release gates
        run: echo "All release gates passed for ${IMAGE_REF}."

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    needs:
      - release-ready
      - runtime-image
      - analysis-candidate
    if: github.event_name != 'pull_request'
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://momo-result.ponta.me
    env:
      IMAGE_ARTIFACT_NAME: ${{ needs.runtime-image.outputs.artifact_name }}
      IMAGE_REF: ${{ needs.runtime-image.outputs.image_ref }}
      RUNTIME_CANDIDATE_RUN_ATTEMPT: ${{ needs.runtime-image.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build structured CI tool
        uses: ./.github/actions/setup-ci-tool

      - name: Download smoke-tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.runtime-image.outputs.artifact_id }}
          path: ${{ env.IMAGE_ARTIFACT_NAME }}

      - name: Load smoke-tested image
        run: scripts/ci/load-runtime-image-artifact.sh
        timeout-minutes: 10

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79

      - name: Download exact worker producer metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.analysis-candidate.outputs.metadata_artifact_id }}
          path: analysis-candidate-metadata

      - name: Validate worker candidate
        id: analysis-candidate
        env:
          PRODUCER_ATTEMPT: ${{ needs.analysis-candidate.outputs.producer_run_attempt }}
        run: |
          candidate=analysis-candidate-metadata/candidate.json
          scripts/ci/ci-tool.sh analysis-candidate \
            "${candidate}" "${GITHUB_RUN_ID}" "${PRODUCER_ATTEMPT}" "${GITHUB_SHA}" \
            --config fly.analysis.toml \
            >> "${GITHUB_OUTPUT}"

      - name: Download verified worker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.analysis-candidate.outputs.image_artifact_id }}
          path: analysis-candidate-image

      - name: Load verified worker image
        env:
          CANDIDATE_IMAGE: ${{ steps.analysis-candidate.outputs.image_ref }}
          CANDIDATE_TAR_SHA: ${{ steps.analysis-candidate.outputs.tar_sha256 }}
        run: scripts/ci/load-analysis-candidate.sh analysis-candidate-image "${CANDIDATE_IMAGE}" "${CANDIDATE_TAR_SHA}"

      - name: Authenticate Docker to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Push smoke-tested image
        id: registry
        run: |
          docker push "${IMAGE_REF}"
          registry_ref="$(scripts/ci/resolve-pushed-runtime-image.sh "${IMAGE_REF}")"
          docker manifest inspect "${registry_ref}" | scripts/ci/ci-tool.sh canonical-json \
            > "${IMAGE_ARTIFACT_NAME}/registry-manifest.json"
          printf '%s\n' "${registry_ref}" > "${IMAGE_ARTIFACT_NAME}/registry-ref.txt"
          printf 'registry_ref=%s\n' "${registry_ref}" >> "${GITHUB_OUTPUT}"
        timeout-minutes: 10

      - name: Upload pushed image manifest
        id: manifest-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-image-registry-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IMAGE_ARTIFACT_NAME }}/registry-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create immutable deployment provenance
        env:
          MANIFEST_ARTIFACT_DIGEST: ${{ steps.manifest-upload.outputs.artifact-digest }}
          MANIFEST_ARTIFACT_ID: ${{ steps.manifest-upload.outputs.artifact-id }}
          REGISTRY_REF: ${{ steps.registry.outputs.registry_ref }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.runtime-image.outputs.artifact_digest }}
          SOURCE_ARTIFACT_ID: ${{ needs.runtime-image.outputs.artifact_id }}
        run: |
          mkdir -p runtime-deployment-metadata
          scripts/ci/ci-tool.sh create-runtime-deployment \
            --candidate "${IMAGE_ARTIFACT_NAME}/candidate.json" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --registry-ref "${REGISTRY_REF}" \
            --source-artifact-id "${SOURCE_ARTIFACT_ID}" --source-artifact-digest "${SOURCE_ARTIFACT_DIGEST}" \
            --manifest "${IMAGE_ARTIFACT_NAME}/registry-manifest.json" \
            --manifest-artifact-id "${MANIFEST_ARTIFACT_ID}" --manifest-artifact-digest "${MANIFEST_ARTIFACT_DIGEST}" \
            > runtime-deployment-metadata/deployment.json

      - name: Upload immutable deployment provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-deployment-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-deployment-metadata/deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject a stale runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin refs/heads/master
          test "${GITHUB_SHA}" = "$(git rev-parse FETCH_HEAD)" || {
            echo "A newer release superseded this candidate; use its deploy run." >&2
            exit 1
          }

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --image "${{ steps.registry.outputs.registry_ref }}" --yes
          scripts/ci/start-deployed-machine.sh runtime momo-result "${{ steps.registry.outputs.registry_ref }}"

      - name: Verify deployed image identity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p runtime-production-evidence
          flyctl machine list --app momo-result --json |
            scripts/ci/ci-tool.sh runtime-machine-evidence "${{ steps.registry.outputs.registry_ref }}" \
            > runtime-production-evidence/deployment-state.json
        timeout-minutes: 2

      - name: Run post-deploy dependency, process, and public edge smoke
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: scripts/ci/runtime-postdeploy-smoke.sh
        timeout-minutes: 3

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-production-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy and verify Processing Worker
        env:
          ANALYSIS_IMAGE_REF: ${{ steps.analysis-candidate.outputs.image_ref }}
          ANALYSIS_RELEASE_SHA: ${{ github.sha }}
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: scripts/ci/deploy-processing-worker.sh
        timeout-minutes: 25

      - name: Reconcile analysis promotion and backfill
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: scripts/ops/analysis-maintain.sh auto
        timeout-minutes: 35

      - name: Summarize maintenance and required follow-up
        if: always()
        env:
          OPERATION_RESULT: ${{ job.status }}
        run: scripts/ci/analysis-maintenance-summary.sh

      - name: Upload analysis release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: analysis-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis-production-artifact/
          if-no-files-found: ignore
          retention-days: 7
