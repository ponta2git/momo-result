name: PR

on:
  pull_request:
    # Metadata edits and base retargeting must refresh the required gate too.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      analysis: ${{ steps.changes.outputs.analysis }}
      analysis_image: ${{ steps.changes.outputs.analysis_image }}
      runtime: ${{ steps.changes.outputs.runtime }}
      system_e2e: ${{ steps.changes.outputs.system_e2e }}
      http4s_patch: ${{ steps.changes.outputs.http4s_patch }}
      workflow: ${{ steps.changes.outputs.workflow }}
      actionlint: ${{ steps.changes.outputs.actionlint }}
      go_runtime: ${{ steps.changes.outputs.go_runtime }}
      go_tools: ${{ steps.changes.outputs.go_tools }}
      policy_scripts: ${{ steps.changes.outputs.policy_scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit's parents contain both endpoint trees for diff.
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}" --
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/classify-git-range.sh "${BASE_SHA}" "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  branch-policy:
    name: Pull request branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only release snapshot validation walks commit ancestry.
          fetch-depth: ${{ github.event.pull_request.base.ref == 'master' && '0' || '1' }}
          persist-credentials: false
      - name: Validate pull request destination and release snapshot
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          develop_sha=""
          if [[ "${BASE_REF}" == "master" ]]; then
            GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin refs/heads/develop
            develop_sha="$(git rev-parse FETCH_HEAD)"
          fi
          jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}" > pull-request-body.md
          scripts/ci/check-pr-branch-policy.sh \
            "${BASE_REF}" "${HEAD_REF}" "${HEAD_REPOSITORY}" "${REPOSITORY}" \
            "${BASE_SHA}" "${HEAD_SHA}" "${develop_sha}" pull-request-body.md

  public-safety:
    name: Public repository safety
    uses: ./.github/workflows/public-safety.yml

  workflow-lint:
    name: Workflow lint
    needs: classify
    if: github.event.pull_request.base.ref != 'master' && needs.classify.outputs.workflow == 'true'
    uses: ./.github/workflows/workflow-lint.yml
    with:
      actionlint: ${{ needs.classify.outputs.actionlint == 'true' }}
      go_runtime: ${{ needs.classify.outputs.go_runtime == 'true' }}
      go_tools: ${{ needs.classify.outputs.go_tools == 'true' }}
      policy_scripts: ${{ needs.classify.outputs.policy_scripts == 'true' }}

  api:
    name: API
    needs: classify
    if: github.event.pull_request.base.ref != 'master' && needs.classify.outputs.api == 'true'
    uses: ./.github/workflows/api.yml
    with:
      test_http4s_patch: ${{ needs.classify.outputs.http4s_patch == 'true' }}

  web:
    name: Web
    needs: classify
    if: github.event.pull_request.base.ref != 'master' && needs.classify.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  analysis:
    name: Analysis worker
    needs: classify
    if: github.event.pull_request.base.ref != 'master' && needs.classify.outputs.analysis == 'true'
    uses: ./.github/workflows/processing-worker.yml
    with:
      verify_image: ${{ needs.classify.outputs.analysis_image == 'true' }}
      package_image: ${{ needs.classify.outputs.system_e2e == 'true' }}

  runtime:
    name: Runtime smoke
    needs: classify
    if: github.event.pull_request.base.ref != 'master' && needs.classify.outputs.runtime == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      package_image: ${{ needs.classify.outputs.system_e2e == 'true' }}

  system-e2e:
    name: System E2E
    needs: [classify, runtime, analysis]
    if: github.event.pull_request.base.ref != 'master' && needs.classify.outputs.system_e2e == 'true'
    uses: ./.github/workflows/system-e2e.yml
    with:
      runtime_artifact_id: ${{ needs.runtime.outputs.artifact_id }}
      runtime_artifact_digest: ${{ needs.runtime.outputs.artifact_digest }}
      runtime_artifact_name: ${{ needs.runtime.outputs.artifact_name }}
      runtime_image_ref: ${{ needs.runtime.outputs.image_ref }}
      runtime_run_attempt: ${{ needs.runtime.outputs.run_attempt }}
      worker_metadata_id: ${{ needs.analysis.outputs.metadata_artifact_id }}
      worker_metadata_digest: ${{ needs.analysis.outputs.metadata_artifact_digest }}
      worker_metadata_name: ${{ needs.analysis.outputs.metadata_artifact_name }}
      worker_run_attempt: ${{ needs.analysis.outputs.producer_run_attempt }}

  pr-ready:
    name: pr-ready
    if: always()
    needs:
      - classify
      - branch-policy
      - public-safety
      - workflow-lint
      - api
      - web
      - analysis
      - runtime
      - system-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm required PR gates
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
          PUBLIC_SAFETY_RESULT: ${{ needs.public-safety.result }}
          WORKFLOW_LINT_EXPECTED: ${{ needs.classify.outputs.workflow }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          API_EXPECTED: ${{ needs.classify.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          WEB_EXPECTED: ${{ needs.classify.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          ANALYSIS_EXPECTED: ${{ needs.classify.outputs.analysis }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          RUNTIME_EXPECTED: ${{ needs.classify.outputs.runtime }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          SYSTEM_E2E_EXPECTED: ${{ needs.classify.outputs.system_e2e }}
          SYSTEM_E2E_RESULT: ${{ needs.system-e2e.result }}
        run: scripts/ci/check-pr-ready.sh
