app = "momo-result"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = 90

[deploy]
  release_command = "/opt/momo-result/bin/momo-runtime-tool preflight"

[env]
  DB_POOL_SIZE = "3"
  OCR_REDIS_BLOCK_SECONDS = "5"
  OCR_TIMEOUT_SECONDS = "30"
  REDIS_ALLOW_PLAINTEXT_IN_PROD = "true"
  IMAGE_ORPHAN_OLDER_THAN_MINUTES = "60"
  IMAGE_ORPHAN_REAPER_INTERVAL_MINUTES = "60"
  SESSION_PRUNE_INTERVAL_MINUTES = "1440"

[http_service]
  force_https = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 6
    hard_limit = 12

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    path = "/healthz"

    [http_service.checks.headers]
      Host = "momo-result.ponta.me"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"
