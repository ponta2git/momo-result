name: workflow-lint

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "scripts/ci/actionlint.sh"
      - "scripts/ci/install-actionlint.sh"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/actionlint"
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint
        run: scripts/ci/actionlint.sh
