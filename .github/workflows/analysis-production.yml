name: Analysis production operation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production analysis operation
        required: true
        type: choice
        options:
          - deploy
          - backfill-dry-run
          - backfill-apply
          - audit
      operation_key:
        description: Required for initial backfill dry-run and apply
        required: false
        type: string
      candidate_run_id:
        description: Successful Analysis candidate run ID required for deployment
        required: false
        type: string
      require_current:
        description: Require current artifacts during audit
        required: false
        default: false
        type: boolean
      require_quiescent:
        description: Require no active or pending work during audit
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  ANALYSIS_APP: momo-result-analysis

concurrency:
  group: production-analysis-operation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate immutable operation inputs
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          OPERATION: ${{ inputs.operation }}
          OPERATION_KEY: ${{ inputs.operation_key }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Production analysis operations must run from master." >&2
            exit 1
          fi
          case "${OPERATION}" in
            backfill-dry-run|backfill-apply)
              if [[ -n "${CANDIDATE_RUN_ID}" ]]; then
                echo "candidate_run_id is only accepted for deploy operations." >&2
                exit 1
              fi
              if [[ ! "${OPERATION_KEY}" =~ ^[A-Za-z0-9._:-]{8,128}$ ]]; then
                echo "A safe 8-128 character operation key is required for backfill." >&2
                exit 1
              fi
              ;;
            deploy)
              if [[ ! "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
                echo "A successful Analysis candidate run ID is required for deployment." >&2
                exit 1
              fi
              if [[ -n "${OPERATION_KEY}" ]]; then
                echo "operation_key is only accepted for backfill operations." >&2
                exit 1
              fi
              ;;
            audit)
              if [[ -n "${CANDIDATE_RUN_ID}" ]]; then
                echo "candidate_run_id is only accepted for deploy operations." >&2
                exit 1
              fi
              if [[ -n "${OPERATION_KEY}" ]]; then
                echo "operation_key is only accepted for backfill operations." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported production analysis operation." >&2
              exit 1
              ;;
          esac

  resolve-candidate:
    needs: validate
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.provenance.outputs.candidate_sha }}
      image_artifact_name: ${{ steps.provenance.outputs.image_artifact_name }}
      image_ref: ${{ steps.provenance.outputs.image_ref }}
      tar_sha256: ${{ steps.provenance.outputs.tar_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve successful candidate run
        id: run
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="${RUNNER_TEMP}/analysis-candidate-run.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            > "${run_json}"
          jq -e \
            --arg path ".github/workflows/analysis-candidate.yml" \
            --arg repository "${GITHUB_REPOSITORY}" '
              .name == "Analysis candidate" and
              .path == $path and
              (.event == "push" or .event == "workflow_dispatch") and
              .head_branch == "master" and
              .head_repository.full_name == $repository and
              .conclusion == "success" and
              (.run_attempt | type == "number" and . >= 1) and
              (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' "${run_json}" > /dev/null || {
              echo "The selected run is not a successful trusted Analysis candidate." >&2
              exit 1
            }
          candidate_sha="$(jq -r '.head_sha' "${run_json}")"
          run_attempt="$(jq -r '.run_attempt' "${run_json}")"
          git merge-base --is-ancestor "${candidate_sha}" "${GITHUB_SHA}" || {
            echo "The selected candidate is not an ancestor of current master." >&2
            exit 1
          }
          printf 'candidate_sha=%s\n' "${candidate_sha}" >> "${GITHUB_OUTPUT}"
          printf 'run_attempt=%s\n' "${run_attempt}" >> "${GITHUB_OUTPUT}"

      - name: Download candidate provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analysis-candidate-metadata-${{ inputs.candidate_run_id }}-${{ steps.run.outputs.run_attempt }}
          path: analysis-candidate-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Validate candidate provenance and image artifact
        id: provenance
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ steps.run.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ steps.run.outputs.run_attempt }}
        run: |
          metadata="analysis-candidate-metadata/candidate.json"
          scripts/ci/validate-analysis-candidate.sh \
            "${metadata}" "${CANDIDATE_RUN_ID}" "${RUN_ATTEMPT}" "${CANDIDATE_SHA}" \
            >> "${GITHUB_OUTPUT}"

          expected_config_sha="$(jq -r '.configSha256' "${metadata}")"
          actual_config_sha="$(sha256sum fly.analysis.toml | cut -d ' ' -f 1)"
          [[ "${actual_config_sha}" == "${expected_config_sha}" ]] || {
            echo "fly.analysis.toml changed after candidate validation." >&2
            exit 1
          }

          artifact_id="$(jq -r '.imageArtifactId' "${metadata}")"
          artifact_json="${RUNNER_TEMP}/analysis-candidate-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
            > "${artifact_json}"
          jq -e \
            --arg digest "$(jq -r '.imageArtifactDigest' "${metadata}")" \
            --arg name "$(jq -r '.imageArtifactName' "${metadata}")" \
            --argjson artifactId "${artifact_id}" \
            --argjson runId "${CANDIDATE_RUN_ID}" '
              .id == $artifactId and
              .name == $name and
              .digest == $digest and
              .expired == false and
              .workflow_run.id == $runId
            ' "${artifact_json}" > /dev/null || {
              echo "The selected image artifact no longer matches candidate provenance." >&2
              exit 1
            }

  operate:
    needs:
      - validate
      - resolve-candidate
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          ((inputs.operation == 'deploy' &&
            needs.resolve-candidate.result == 'success') ||
           (inputs.operation != 'deploy' &&
            needs.resolve-candidate.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANALYSIS_IMAGE_ARTIFACT_NAME: ${{ needs.resolve-candidate.outputs.image_artifact_name }}
      ANALYSIS_IMAGE_REF: ${{ needs.resolve-candidate.outputs.image_ref }}
    environment:
      name: production
      url: https://momo-result.ponta.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download scanned analysis worker image
        if: inputs.operation == 'deploy'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ANALYSIS_IMAGE_ARTIFACT_NAME }}
          path: ${{ env.ANALYSIS_IMAGE_ARTIFACT_NAME }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Load and verify scanned analysis worker image
        if: inputs.operation == 'deploy'
        env:
          EXPECTED_TAR_SHA256: ${{ needs.resolve-candidate.outputs.tar_sha256 }}
        run: >-
          scripts/ci/load-analysis-candidate.sh
          "${ANALYSIS_IMAGE_ARTIFACT_NAME}"
          "${ANALYSIS_IMAGE_REF}"
          "${EXPECTED_TAR_SHA256}"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79

      - name: Authenticate Docker to Fly registry
        if: inputs.operation == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Push scanned analysis worker image
        if: inputs.operation == 'deploy'
        run: |
          mkdir -p analysis-production-artifact
          docker push "${ANALYSIS_IMAGE_REF}"
          docker manifest inspect "${ANALYSIS_IMAGE_REF}" \
            > analysis-production-artifact/registry-manifest.json
        timeout-minutes: 10

      - name: Deploy analysis worker
        if: inputs.operation == 'deploy'
        env:
          ANALYSIS_CONFIG_VERSION: series-analysis-v1-${{ needs.resolve-candidate.outputs.candidate_sha }}
          ANALYSIS_WORKER_ID: worker-${{ github.run_id }}-${{ github.run_attempt }}
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
          OCR_WORKER_ID: ocr-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          flyctl deploy
          --config fly.analysis.toml
          --image "${ANALYSIS_IMAGE_REF}"
          --env MOMO_ANALYSIS_PUBLICATION_MODE=enabled
          --env MOMO_ANALYSIS_CONFIG_VERSION="${ANALYSIS_CONFIG_VERSION}"
          --env MOMO_ANALYSIS_WORKER_ID="${ANALYSIS_WORKER_ID}"
          --env MOMO_OCR_V2_CONSUMER_MODE=enabled
          --env MOMO_OCR_V2_WORKER_ID="${OCR_WORKER_ID}"
          --ha=false
          --yes
        timeout-minutes: 15

      - name: Verify enabled combined worker identity and resources
        if: inputs.operation == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: |
          flyctl machine list --app "${ANALYSIS_APP}" --json |
            jq -e --arg image "${ANALYSIS_IMAGE_REF}" '
              {
                singleStartedExactEnabledImage: (
                  length == 1 and
                  all(.[];
                    .state == "started" and
                    .config.image == $image and
                    .config.env.MOMO_ANALYSIS_PUBLICATION_MODE == "enabled" and
                    .config.env.MOMO_OCR_V2_CONSUMER_MODE == "enabled" and
                    (.config.env.MOMO_ANALYSIS_WORKER_ID | type == "string" and length > 0) and
                    (.config.env.MOMO_OCR_V2_WORKER_ID | type == "string" and length > 0) and
                    .config.guest.cpu_kind == "shared" and
                    .config.guest.cpus == 1 and
                    .config.guest.memory_mb == 256
                  )
                )
              } |
              select(.singleStartedExactEnabledImage)
            ' > analysis-production-artifact/enabled-deployment-state.json
        timeout-minutes: 2

      - name: Run release audit
        if: inputs.operation == 'audit'
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
          REQUIRE_CURRENT: ${{ inputs.require_current }}
          REQUIRE_QUIESCENT: ${{ inputs.require_quiescent }}
        run: |
          command="/usr/local/bin/momo-analysis bootstrap -- release-audit"
          if [[ "${REQUIRE_CURRENT}" == "true" ]]; then
            command="${command} --require-current"
          fi
          if [[ "${REQUIRE_QUIESCENT}" == "true" ]]; then
            command="${command} --require-quiescent"
          fi
          flyctl ssh console --app "${ANALYSIS_APP}" --pty=false --quiet \
            --command "${command}" > "${RUNNER_TEMP}/analysis-operation.json"

      - name: Dry-run initial backfill
        if: inputs.operation == 'backfill-dry-run'
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
          OPERATION_KEY: ${{ inputs.operation_key }}
        run: >-
          flyctl ssh console
          --app "${ANALYSIS_APP}"
          --pty=false
          --quiet
          --command "/usr/local/bin/momo-analysis bootstrap -- release-promote --trigger initial-backfill --operation-key ${OPERATION_KEY}"
          > "${RUNNER_TEMP}/analysis-operation.json"

      - name: Apply initial backfill
        if: inputs.operation == 'backfill-apply'
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
          OPERATION_KEY: ${{ inputs.operation_key }}
        run: >-
          flyctl ssh console
          --app "${ANALYSIS_APP}"
          --pty=false
          --quiet
          --command "/usr/local/bin/momo-analysis bootstrap -- release-promote --trigger initial-backfill --operation-key ${OPERATION_KEY} --apply"
          > "${RUNNER_TEMP}/analysis-operation.json"

      - name: Sanitize and show release operation report
        if: inputs.operation == 'audit' || startsWith(inputs.operation, 'backfill-')
        run: |
          mkdir -p analysis-production-artifact
          scripts/ci/sanitize-analysis-report.sh \
            "${RUNNER_TEMP}/analysis-operation.json" \
            analysis-production-artifact/operation-report.json
          jq . analysis-production-artifact/operation-report.json

      - name: Upload production operation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: analysis-production-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            analysis-production-artifact/
          if-no-files-found: ignore
          retention-days: 7
