name: workflow-lint

on:
  workflow_call:
    inputs:
      actionlint:
        required: false
        default: true
        type: boolean
      go_tools:
        required: false
        default: true
        type: boolean
      policy_scripts:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.actionlint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/actionlint"
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint
        run: scripts/ci/actionlint.sh

  go-tools:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.go_tools
    strategy:
      fail-fast: false
      matrix:
        module: [apps/runtime, scripts/tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: ${{ matrix.module }}/go.sum
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Test Go module
        working-directory: ${{ matrix.module }}
        run: |
          go test ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  policy-scripts:
    name: Policy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.policy_scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install coverage XML reader
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Test workflow policy scripts
        run: scripts/ci/check-policy.sh
