name: public-safety

on:
  workflow_call:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public repository safety
        run: scripts/ci/public-repo-safety-check.sh
