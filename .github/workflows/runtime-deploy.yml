name: Deploy verified runtime candidates

on:
  workflow_call:
    inputs:
      producer_run_id:
        required: true
        type: string
      runtime_artifact_id:
        required: true
        type: string
      runtime_artifact_digest:
        required: true
        type: string
      runtime_artifact_name:
        required: true
        type: string
      runtime_image_ref:
        required: true
        type: string
      runtime_run_attempt:
        required: true
        type: string
      worker_metadata_id:
        required: true
        type: string
      worker_metadata_digest:
        required: true
        type: string
      worker_metadata_name:
        required: true
        type: string
      worker_run_attempt:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://momo-result.ponta.me
    env:
      IMAGE_ARTIFACT_NAME: ${{ inputs.runtime_artifact_name }}
      IMAGE_REF: ${{ inputs.runtime_image_ref }}
      RUNTIME_CANDIDATE_RUN_ID: ${{ inputs.producer_run_id }}
      RUNTIME_CANDIDATE_RUN_ATTEMPT: ${{ inputs.runtime_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build structured CI tool
        uses: ./.github/actions/setup-ci-tool

      - name: Download smoke-tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.runtime_artifact_id }}
          path: ${{ env.IMAGE_ARTIFACT_NAME }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Load smoke-tested image
        run: scripts/ci/load-runtime-image-artifact.sh
        timeout-minutes: 10

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79

      - name: Download exact worker producer metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.worker_metadata_id }}
          path: analysis-candidate-metadata
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Validate worker candidate
        id: analysis-candidate
        env:
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.worker_run_attempt }}
        run: |
          candidate=analysis-candidate-metadata/candidate.json
          scripts/ci/ci-tool.sh analysis-candidate \
            "${candidate}" "${PRODUCER_RUN_ID}" "${PRODUCER_ATTEMPT}" "${GITHUB_SHA}" \
            --config fly.analysis.toml \
            >> "${GITHUB_OUTPUT}"

      - name: Download verified worker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.analysis-candidate.outputs.image_artifact_id }}
          path: analysis-candidate-image
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Load verified worker image
        env:
          CANDIDATE_IMAGE: ${{ steps.analysis-candidate.outputs.image_ref }}
          CANDIDATE_TAR_SHA: ${{ steps.analysis-candidate.outputs.tar_sha256 }}
        run: scripts/ci/load-analysis-candidate.sh analysis-candidate-image "${CANDIDATE_IMAGE}" "${CANDIDATE_TAR_SHA}"

      - name: Authenticate Docker to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Push smoke-tested image
        id: registry
        run: |
          docker push "${IMAGE_REF}"
          registry_ref="$(scripts/ci/resolve-pushed-runtime-image.sh "${IMAGE_REF}")"
          docker manifest inspect "${registry_ref}" | scripts/ci/ci-tool.sh canonical-json \
            > "${IMAGE_ARTIFACT_NAME}/registry-manifest.json"
          printf '%s\n' "${registry_ref}" > "${IMAGE_ARTIFACT_NAME}/registry-ref.txt"
          printf 'registry_ref=%s\n' "${registry_ref}" >> "${GITHUB_OUTPUT}"
        timeout-minutes: 10

      - name: Upload pushed image manifest
        id: manifest-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-image-registry-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IMAGE_ARTIFACT_NAME }}/registry-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create immutable deployment provenance
        env:
          MANIFEST_ARTIFACT_DIGEST: ${{ steps.manifest-upload.outputs.artifact-digest }}
          MANIFEST_ARTIFACT_ID: ${{ steps.manifest-upload.outputs.artifact-id }}
          REGISTRY_REF: ${{ steps.registry.outputs.registry_ref }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.runtime_artifact_digest }}
          SOURCE_ARTIFACT_ID: ${{ inputs.runtime_artifact_id }}
        run: |
          mkdir -p runtime-deployment-metadata
          scripts/ci/ci-tool.sh create-runtime-deployment \
            --candidate "${IMAGE_ARTIFACT_NAME}/candidate.json" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --registry-ref "${REGISTRY_REF}" \
            --source-artifact-id "${SOURCE_ARTIFACT_ID}" --source-artifact-digest "${SOURCE_ARTIFACT_DIGEST}" \
            --manifest "${IMAGE_ARTIFACT_NAME}/registry-manifest.json" \
            --manifest-artifact-id "${MANIFEST_ARTIFACT_ID}" --manifest-artifact-digest "${MANIFEST_ARTIFACT_DIGEST}" \
            > runtime-deployment-metadata/deployment.json

      - name: Upload immutable deployment provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-deployment-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-deployment-metadata/deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject a stale runtime release
        run: |
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin refs/heads/master
          test "${GITHUB_SHA}" = "$(git rev-parse FETCH_HEAD)" || {
            echo "A newer release superseded this candidate; use its deploy run." >&2
            exit 1
          }

      - name: Stop old consumers and wait for the DB-job migration
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_CUTOVER_COMPLETE: ${{ vars.JOBS_CUTOVER_COMPLETE }}
          JOBS_CUTOVER_DB_RUN_ID: ${{ vars.JOBS_CUTOVER_DB_RUN_ID }}
          RUNTIME_FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WORKER_FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: scripts/ci/job-scheduler-cutover.sh
        timeout-minutes: 35

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --image "${{ steps.registry.outputs.registry_ref }}" --yes
          scripts/ci/start-deployed-machine.sh runtime momo-result "${{ steps.registry.outputs.registry_ref }}"

      - name: Verify deployed image identity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p runtime-production-evidence
          flyctl machine list --app momo-result --json |
            scripts/ci/ci-tool.sh runtime-machine-evidence "${{ steps.registry.outputs.registry_ref }}" \
            > runtime-production-evidence/deployment-state.json
        timeout-minutes: 2

      - name: Run post-deploy dependency, process, and public edge smoke
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: scripts/ci/runtime-postdeploy-smoke.sh
        timeout-minutes: 3

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-production-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy and verify Processing Worker
        env:
          ANALYSIS_IMAGE_REF: ${{ steps.analysis-candidate.outputs.image_ref }}
          ANALYSIS_RELEASE_SHA: ${{ github.sha }}
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: scripts/ci/deploy-processing-worker.sh
        timeout-minutes: 25

      - name: Reconcile analysis promotion and backfill
        env:
          FLY_API_TOKEN: ${{ secrets.ANALYSIS_FLY_API_TOKEN }}
        run: scripts/ops/analysis-maintain.sh auto
        timeout-minutes: 35

      - name: Summarize maintenance and required follow-up
        if: always()
        env:
          OPERATION_RESULT: ${{ job.status }}
        run: scripts/ci/analysis-maintenance-summary.sh

      - name: Upload analysis release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: analysis-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis-production-artifact/
          if-no-files-found: ignore
          retention-days: 7
