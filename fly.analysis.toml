app = "momo-result-analysis"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "apps/processing-worker/Dockerfile"

[processes]
  worker = "/usr/local/bin/momo-processing-worker bootstrap -- worker"

[env]
  MOMO_ANALYSIS_CALCULATION_TIMEOUT_MS = "120000"
  MOMO_ANALYSIS_CHILD_MEMORY_LIMIT_BYTES = "201326592"
  MOMO_ANALYSIS_CHILD_STOP_GRACE_MS = "1000"
  MOMO_ANALYSIS_CHUNK_COUNT_MAX = "4096"
  MOMO_ANALYSIS_CHUNK_MAX_BYTES = "8388608"
  MOMO_ANALYSIS_FINALIZATION_TIMEOUT_MS = "30000"
  MOMO_ANALYSIS_HEARTBEAT_INTERVAL_MS = "1000"
  MOMO_ANALYSIS_LEASE_DURATION_MS = "60000"
  MOMO_ANALYSIS_PARENT_HEADROOM_BYTES = "67108864"
  MOMO_ANALYSIS_PUBLICATION_MODE = "disabled"
  MOMO_ANALYSIS_PEL_RECOVERY_INTERVAL_MS = "300000"
  MOMO_ANALYSIS_REDIS_BLOCK_MS = "1000"
  MOMO_ANALYSIS_REDIS_GROUP = "momo-analysis-v1"
  MOMO_ANALYSIS_RUNTIME_MEMORY_LIMIT_BYTES = "268435456"
  MOMO_ANALYSIS_TEMPORARY_FILE_COUNT_MAX = "4097"
  MOMO_ANALYSIS_TEMPORARY_MAX_BYTES = "67108864"
  MOMO_ANALYSIS_TEMPORARY_ROOT = "/var/lib/momo-analysis"
  MOMO_LOG_FORMAT = "json"
  MOMO_OCR_V2_CLAIM_IDLE_MS = "120000"
  MOMO_OCR_V2_CONSUMER_MODE = "disabled"
  MOMO_OCR_V2_FINALIZATION_TIMEOUT_MS = "5000"
  MOMO_OCR_V2_HEARTBEAT_INTERVAL_MS = "5000"
  MOMO_OCR_V2_LEASE_DURATION_MS = "60000"
  MOMO_OCR_V2_MAXIMUM_DELIVERY_ATTEMPTS = "2"
  MOMO_OCR_V2_PENDING_SCAN_COUNT = "10"
  MOMO_OCR_V2_PEL_RECOVERY_INTERVAL_MS = "300000"
  MOMO_OCR_V2_R2_ATTEMPT_TIMEOUT_MS = "5000"
  MOMO_OCR_V2_R2_MAXIMUM_ATTEMPTS = "2"
  MOMO_OCR_V2_R2_OPERATION_TIMEOUT_MS = "10000"
  MOMO_OCR_V2_REDIS_BLOCK_MS = "5000"
  MOMO_OCR_V2_REDIS_GROUP = "momo-ocr-rust-v2"
  MOMO_OCR_V2_RETRY_DELAY_MS = "1000"
  MOMO_OCR_V2_TIMEOUT_MS = "30000"
  MOMO_REDIS_ANALYSIS_STREAM = "momo:analysis:jobs"
  OCR_REDIS_V2_DEAD_LETTER_STREAM = "momo:ocr:v2:jobs:dead"
  OCR_REDIS_V2_STREAM = "momo:ocr:v2:jobs"
  RUST_LOG = "momo_processing_worker=info"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
