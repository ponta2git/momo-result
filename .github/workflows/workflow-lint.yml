name: workflow-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/actionlint"
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint
        run: scripts/ci/actionlint.sh
      - name: Test workflow policy scripts
        run: |
          scripts/ci/test-classify-changes.sh
          scripts/ci/test-check-pr-ready.sh
          scripts/ci/test-canonicalize-artifact-digest.sh
          scripts/ci/test-validate-analysis-candidate.sh
          scripts/ci/test-load-analysis-candidate.sh
          scripts/ci/test-load-runtime-image-artifact.sh
          scripts/ci/test-resolve-pushed-runtime-image.sh
          scripts/ci/test-runtime-deploy-scripts.py
          scripts/ci/runtime-workflow-contracts.sh
          scripts/ci/test-sanitize-analysis-report.sh
          scripts/ci/test-validate-runtime-deployment.sh
