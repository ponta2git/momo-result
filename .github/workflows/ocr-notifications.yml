name: OCR notification E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembled-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: momo-result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: momo-result
          persist-credentials: false
      - name: Read pinned cross-repository revisions
        id: revisions
        run: |
          db_ref="$(tr -d '\r\n' < .momo-db-ref)"
          summit_ref="$(tr -d '\r\n' < .summit-ref)"
          [[ "${db_ref}" =~ ^[0-9a-f]{40}$ && "${summit_ref}" =~ ^[0-9a-f]{40}$ ]]
          printf 'db=%s\nsummit=%s\n' "${db_ref}" "${summit_ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/momo-db
          ref: ${{ steps.revisions.outputs.db }}
          path: momo-db
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/summit
          ref: ${{ steps.revisions.outputs.summit }}
          path: summit
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: summit/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      - name: Build shared schema
        working-directory: momo-db
        run: test "$(pnpm --version)" = 11.20.0 && pnpm install --frozen-lockfile && pnpm build
      - name: Prepare record-only Summit
        working-directory: summit
        run: test "$(pnpm --version)" = 11.20.0 && pnpm install --frozen-lockfile && pnpm build
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          package_json_file: momo-result/package.json
      - run: test "$(pnpm --version)" = 10.34.5 && pnpm install --frozen-lockfile
      - name: Check isolated harness diagnostics
        run: pnpm --filter web e2e:ocr-notifications:check
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build controlled Linux Worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: ./momo-result
          file: momo-result/apps/processing-worker/Dockerfile
          target: e2e-test
          load: true
          tags: mom24-worker-e2e:ci
          cache-from: |
            type=gha,scope=momo-result-ocr-e2e-v1
            type=gha,scope=momo-result-analysis-v1
          cache-to: type=gha,mode=max,scope=momo-result-ocr-e2e-v1,ignore-error=true
        timeout-minutes: 30
      - name: Exercise browser through real API, storage, queue and notification runtime
        env:
          MOM24_WORKER_TEST_IMAGE: mom24-worker-e2e:ci
          MOM24_SUMMIT_DIR: ${{ github.workspace }}/summit
          MOMO_DB_MIGRATIONS_DIR: ${{ github.workspace }}/momo-db/drizzle
        run: pnpm --filter web e2e:ocr-notifications
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ocr-notification-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            momo-result/apps/web/playwright-report-ocr/
            momo-result/apps/web/test-results-ocr/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove owned test image
        if: always()
        run: |
          image_id="$(docker image ls --quiet mom24-worker-e2e:ci)"
          if [[ -n "${image_id}" ]]; then docker image rm mom24-worker-e2e:ci; fi
